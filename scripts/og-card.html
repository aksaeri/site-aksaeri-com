<!doctype html>
<!-- Source for public/og.png. Render at 1200x630 and screenshot to public/og.png.
     All text stays inside the centre 630x630 square (x 285-915), so square crops keep it. -->
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #FAFAF7; font-family: Inter, sans-serif; }
  .safe { position: absolute; left: 285px; top: 0; width: 630px; height: 630px; box-sizing: border-box; padding: 72px 40px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; gap: 28px; }
  .name { font-size: 36px; font-weight: 600; color: #127788; letter-spacing: -0.01em; }
  h1 { margin: 0; font-size: 58px; line-height: 1.05; font-weight: 700; color: #1A1A1A; letter-spacing: -0.025em; }
  .url { font-size: 28px; color: #6B6B6B; }
  .nw { white-space: nowrap; }
</style></head>
<body><div class="safe">
  <div class="name">Alexander K Saeri</div>
  <h1>AI risk research<br><span class="nw">for decision-makers</span></h1>
  <div class="url">aksaeri.com</div>
</div></body></html>
